[package]
name = "laman-oracle"
version = "0.0.0"
edition = "2024"
publish = false
description = "Runs other Rust constraint solvers out of process on laman's C1 fixtures. Outside the workspace; by hand, never in the gate."

# The three solvers are pinned exactly: a report is only comparable to the
# version that wrote it (tools/oracle/README.md).
[dependencies]
sketch-solver = "=0.1.0"
acs-solver = "=0.1.19"
ezpz = "=0.2.29"
# The model and the serde form only, and the checker; never laman's solver
# (tools/check-layers.sh).
laman = { path = "../../crates/laman" }
laman-check = { path = "../../crates/laman-check" }
serde_json = "1"

# Its own workspace root, so the parent workspace does not claim it.
[workspace]
