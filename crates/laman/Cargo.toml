[package]
name = "laman"
description = "A deterministic 2D geometric constraint solver in pure Rust. Early release: the generic rigidity count of bar frameworks (Laman's theorem)"
keywords = ["constraint-solver", "cad", "sketch", "geometry", "rigidity"]
categories = ["mathematics", "science", "graphics"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
# The serde form of a sketch (on by default; DATA-MODEL.md §The serde form).
default = ["serde"]
serde = ["dep:serde", "dep:base64"]
# `laman::reference`: the whole-component analysis, for laman's own tests to
# compare the staged one with. Hidden, outside the stability promise and the
# binding (plans/m6-stages).
reference = []

[dependencies]
nalgebra.workspace = true
thiserror.workspace = true
libm.workspace = true
serde = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
# Path-only dev dependencies are omitted from the published manifest. The
# independent checker stays unpublished; it is used by workspace tests only.
laman-check = { path = "../laman-check" }
laman-debug = { path = "../laman-debug" }
serde_json.workspace = true

[lints]
workspace = true
