[package]
name = "laman"
description = "A deterministic 2D geometric constraint solver in pure Rust. Early release: the generic rigidity count of bar frameworks (Laman's theorem)"
keywords = ["constraint-solver", "cad", "sketch", "geometry", "rigidity"]
categories = ["mathematics", "science", "graphics"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[features]
# The serde form of a sketch (on by default; DATA-MODEL.md §The serde form).
default = ["serde"]
serde = ["dep:serde", "dep:base64"]

[dependencies]
thiserror.workspace = true
libm.workspace = true
serde = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
