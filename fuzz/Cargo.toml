[package]
name = "laman-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "Fuzz targets for laman. Outside the workspace: builds on nightly under `cargo fuzz`."

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
laman = { path = "../crates/laman" }
serde_json = "1"

# Its own workspace root, so the parent workspace does not claim it.
[workspace]

[[bin]]
name = "load_sketch"
path = "fuzz_targets/load_sketch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "solve_sketch"
path = "fuzz_targets/solve_sketch.rs"
test = false
doc = false
bench = false

[[bin]]
name = "drag_sketch"
path = "fuzz_targets/drag_sketch.rs"
test = false
doc = false
bench = false
