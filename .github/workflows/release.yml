name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse with temporary stable metadata; never publish
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  # Refuses anything but a v* tag with a matching version and changelog. The
  # build jobs below do not need it, so a dispatch on a branch builds and
  # checks everything and then refuses to publish (ADR-0008).
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag || { echo 'A real release requires a v* tag'; exit 1; }
          # A real release also needs non-empty notes before anything uploads.
          tools/release-check.sh "$REF_NAME" "$RUNNER_TEMP/notes.md"

  wheels:
    uses: ./.github/workflows/wheels.yml

  crate-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Package and verify without uploading
        run: cargo publish -p laman --locked --dry-run

  # Configure the crates-io and pypi environments with a required reviewer before the
  # first real release. Only these two jobs can request a publisher identity.
  publish-crate:
    needs: [release-check, crate-dry-run, wheels]
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/release-check.sh "$GITHUB_REF_NAME"
      # The tag's own CI run is the gate (ADR-0008). An early approval fails
      # safe: re-run this job once CI is green.
      - name: Require a green CI run on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          test "$n" -ge 1 || { echo "No successful ci.yml run for $GITHUB_SHA yet"; exit 1; }
      - run: rustup show
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p laman --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-pypi:
    # Relies on publish-crate, which checked the tag's CI run.
    needs: [release-check, publish-crate, wheels]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The GitHub Release, its notes the version's CHANGELOG.md section, once
  # both registries hold the version.
  github-release:
    needs: [release-check, publish-crate, publish-pypi]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/release-check.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
