name: Release

on:
  push:
    tags: ["v*"]
    # Temporary registration on the plan branch, removed before acceptance.
    branches: [plan/m4-platforms]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Rehearse with temporary stable metadata; never publish
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      dry-run: ${{ steps.mode.outputs.dry-run }}
      metadata-artifact: ${{ steps.mode.outputs.metadata-artifact }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 tools/release-dry-run-test.py
      - name: Check the release or prepare an isolated rehearsal
        id: mode
        env:
          DRY_RUN: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/plan/m4-platforms') || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "dry-run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = true ]; then
            tag=$(python3 tools/release-dry-run.py "$RUNNER_TEMP/release-metadata")
            cp "$RUNNER_TEMP/release-metadata/"* .
            echo 'metadata-artifact=release-metadata' >> "$GITHUB_OUTPUT"
          else
            test "$REF_TYPE" = tag || { echo 'A real release requires a v* tag'; exit 1; }
            tag=$REF_NAME
          fi
          tools/release-check.sh "$tag"
      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.dry-run == 'true'
        with:
          name: release-metadata
          path: ${{ runner.temp }}/release-metadata/*
          if-no-files-found: error

  ci:
    needs: release-check
    uses: ./.github/workflows/ci.yml
    with:
      metadata-artifact: ${{ needs.release-check.outputs.metadata-artifact }}

  wheels:
    needs: release-check
    uses: ./.github/workflows/wheels.yml
    with:
      metadata-artifact: ${{ needs.release-check.outputs.metadata-artifact }}

  crate-dry-run:
    needs: [release-check, ci, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: needs.release-check.outputs.dry-run == 'true'
        with:
          name: release-metadata
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Package and verify without uploading
        env:
          DRY_RUN: ${{ needs.release-check.outputs.dry-run }}
        run: |
          args=()
          # Only the rehearsal overlays metadata on a development checkout.
          if [ "$DRY_RUN" = true ]; then args+=(--allow-dirty); fi
          cargo publish -p laman --locked --dry-run "${args[@]}"

  # Configure the release environment with a required reviewer before the
  # first real release. Only these two jobs can request a publisher identity.
  publish-crate:
    needs: [release-check, crate-dry-run]
    if: needs.release-check.outputs.dry-run == 'false'
    environment: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/release-check.sh "$GITHUB_REF_NAME"
      - run: rustup show
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo publish -p laman --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  publish-pypi:
    needs: [release-check, publish-crate]
    if: needs.release-check.outputs.dry-run == 'false'
    environment: release
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
