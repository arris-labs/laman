name: CI

on:
  push:
    branches: [main, plan/m4-platforms]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The gate (tools/gate.sh): fmt, clippy -D warnings, tests, rustdoc,
  # the wasm32 build. The same script the pre-commit hook runs.
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: tools/gate.sh

  # The determinism corpus (tools/digest-wasm.sh): the digest of every
  # fixture and twin and each drag step, natively and on wasm32-wasip1 under wasmtime, must
  # be identical.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - run: tools/digest-wasm.sh

  # The Python binding: maturin, pytest, mypy.stubtest (tools/py-test.sh).
  python:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-latest
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: tools/py-test.sh
