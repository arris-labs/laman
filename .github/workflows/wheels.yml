name: Wheels

on:
  workflow_call:
  # Not on push: a push to main runs ci.yml alone (ADR-0008). A pull request
  # runs this only when it can change the shipped package or its tests.
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/**"
      - "tests/fixtures/**"
      - "tools/py-*"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/wheels.yml"

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64
          - platform: macos-arm64
            os: macos-15
            target: aarch64
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64
          - platform: windows-x86_64
            os: windows-latest
            target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # Linux builds run natively inside the manylinux2014 container,
      # so maturin refuses symbols newer than glibc 2.17.
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: "2014"
          args: --release --locked --manifest-path crates/laman-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  test:
    name: install (${{ matrix.platform }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: macos-arm64
            os: macos-15
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: dist
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Check Linux wheel compatibility
        if: runner.os == 'Linux'
        run: |
          uv tool run --from auditwheel auditwheel show dist/*.whl | tee auditwheel.txt
          grep -q 'manylinux_2_17_${{ matrix.platform == 'linux-x86_64' && 'x86_64' || 'aarch64' }}' auditwheel.txt
      - name: Install wheel and run the corpus, digests and typing checks
        run: tools/py-package-test.sh dist/*.whl
      # The shipped abi3 wheel on the newest interpreter, Linux x86_64 only.
      - name: Install wheel and run the checks on Python 3.13
        if: matrix.platform == 'linux-x86_64'
        env:
          UV_PYTHON: "3.13"
        run: tools/py-package-test.sh dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path crates/laman-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  test-sdist:
    needs: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: rustup show
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Build from the sdist and run the corpus, digests and typing checks
        run: tools/py-package-test.sh dist/*.tar.gz
