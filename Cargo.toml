# Virtual workspace manifest. The crates and the layer rule between them are
# SEED.md §7 until docs/ARCHITECTURE.md is written (SEED.md §10.2).
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/arris-labs/laman"
homepage = "https://github.com/arris-labs/laman"
# Resolved relative to this manifest, so every member inherits the one
# workspace README as its crates.io front page.
readme = "README.md"

[workspace.dependencies]
# Dense deterministic steps; 0.33 supports the workspace MSRV.
nalgebra = { version = "=0.33.2", default-features = false, features = ["std", "libm-force"] }
# Internal crates: path plus an exact version pin, so a version bump that
# misses one fails `cargo check` (.agents/rules/git.md §The version).
laman = { path = "crates/laman", version = "=0.1.0-dev" }
laman-check = { path = "crates/laman-check", version = "=0.1.0-dev" }

# External crates, pinned here and used with `workspace = true` (SEED.md §7).
thiserror = "2.0"
# Pinned exactly: a transcendental must give the same bits on every target
# (.agents/rules/solver.md). The checker's `atan2` goes through it.
libm = "=0.2.16"
# The serde form (DATA-MODEL.md §The serde form). `float_roundtrip` makes a
# float print and parse back to the same bits.
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
# Payloads are base64 bytes in the serde form.
base64 = "0.22"
# No fork or timeout: they pull wait-timeout, which does not build for wasm32-wasip1.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
# The digest (docs/ARCHITECTURE.md §Determinism); `laman-debug` only.
sha2 = "0.10"
# `laman-py` only, and never on wasm32. Pinned to the minor, as in arris.
# `extension-module` is `laman-py`'s own feature, set by maturin.
pyo3 = { version = "0.26", default-features = false, features = ["macros", "abi3-py310"] }

# Every crate opts in with `[lints] workspace = true` (.agents/rules/solver.md §API).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# No panics on any input (SEED.md §5): the hook and CI run clippy with
# `-D warnings`, so these are errors there. Tests may unwrap (clippy.toml).
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# A new entity or constraint kind fails every dispatch until it is handled
# (.agents/rules/solver.md §API). Also fires on foreign enums: allow one
# locally, with its reason.
wildcard_enum_match_arm = "warn"
